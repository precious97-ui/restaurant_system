<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        body { font-family: Arial; background:#fff8f0; }
        .box {
            max-width:400px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }
        h2 { text-align:center; color:#ff6600; }
        input, button {
            width:100%;
            padding:10px;
            margin-top:10px;
        }
        button {
            background:#ff6600;
            border:none;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover { background:#e65c00; }
    </style>
</head>
<body>

<div class="box">
    <h2>🔐 Reset Password</h2>
    <p>Enter your email address and we’ll send you a reset link.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit">Send Reset Link</button>
    </form>
</div>

</body>
</html>
