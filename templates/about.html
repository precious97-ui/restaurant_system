<!DOCTYPE html>
<html>
<head>
    <title>About Us 🍔</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #ff6600;
            margin-top: 30px;
        }
        .team-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 30px;
            gap: 20px;
        }
        .team-member {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 200px;
            text-align: center;
            padding: 15px;
        }
        .team-member img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
        .team-member h3 {
            margin: 10px 0 5px 0;
            color: #333;
        }
        .team-member p {
            margin: 0;
            color: #777;
        }
    </style>
</head>
<body>
    <h1>Our Team</h1>
    <div class="team-container">
        {% for member in team_members %}
        <div class="team-member">
            {% if member.photo %}
                <img src="{{ member.photo.url }}" alt="{{ member.name }}">
            {% else %}
                <img src="/static/images/default-avatar.png" alt="Default">
            {% endif %}
            <h3>{{ member.name }}</h3>
            <p>{{ member.role }}</p>
            {% if member.bio %}
                <p>{{ member.bio }}</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
