<!DOCTYPE html>
<html>
<head>
    <title>Login 🍔</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url("/static/images/login-bg.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background-color: rgba(243, 239, 239, 0.95);
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            color: #ff6600;
            margin-bottom: 20px;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .show-password {
            cursor: pointer;
            font-size: 14px;
            color: #ff6600;
            margin-bottom: 10px;
            user-select: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #ff6600;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #e65c00;
        }
        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        p {
            text-align: center;
            margin-top: 15px;
        }
        a {
            color: #ff6600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <form method="post" action="{% url 'custom_login' %}">
        {% csrf_token %}
        <h2>Login 🍕</h2>

        <!-- show form errors -->
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- identifier field: username/email/phone -->
        <label>Username / Email / Phone</label>
        <input type="text" name="identifier" placeholder="Enter username, email, or phone" required>

        <label>Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <div class="show-password" onclick="togglePassword('password')">👁️ Show Password</div>

        <button type="submit">Login</button>
        <p>Don't have an account? <a href="{% url 'signup' %}">Sign up 🌯</a></p>
        <p><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
    </form>

    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const toggleDiv = field.nextElementSibling;

            if (field.type === "password") {
                field.type = "text";
                toggleDiv.innerHTML = "🙈 Hide Password";
            } else {
                field.type = "password";
                toggleDiv.innerHTML = "👁️ Show Password";
            }
        }
    </script>
</body>
</html>
