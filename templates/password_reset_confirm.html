<!DOCTYPE html>
<html>
<head>
    <title>New Password</title>
    <style>
        body { font-family: Arial; background:#fff8f0; }
        .box {
            max-width:400px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
        }
        input, button {
            width:100%;
            padding:10px;
            margin-top:10px;
        }
        button {
            background:#ff6600;
            border:none;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🔑 Set New Password</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.new_password1 }}
        {{ form.new_password2 }}
        <button type="submit">Change Password</button>
    </form>
</div>

</body>
</html>
